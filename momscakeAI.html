<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CakeHub | Luxury Bakery</title>

<style>
:root{
    --pink:#e85d88;
    --pink2:#c93668;
    --pink-light:#ffdce8;
    --cream:#fff9f5;
    --white:#fff;
    --brown:#351c1c;
    --brown-light:#735957;
    --gold:#e6a33f;
    --green:#20b866;
    --border:#efdfda;
    --shadow:0 20px 60px rgba(70,30,30,.12);
    --radius:28px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--cream);
    color:var(--brown);
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* LOADER */

#loader{
    position:fixed;
    inset:0;
    background:var(--cream);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    transition:.7s;
}

#loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-content{
    text-align:center;
}

.loader-cake{
    font-size:75px;
    animation:loaderBounce 1s infinite alternate;
}

.loader-title{
    margin-top:10px;
    font-size:25px;
    font-weight:900;
    letter-spacing:5px;
}

@keyframes loaderBounce{
    from{transform:translateY(0) rotate(-5deg)}
    to{transform:translateY(-18px) rotate(5deg)}
}

/* BACKGROUND */

.bg-circle{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:-2;
    filter:blur(3px);
    opacity:.35;
    animation:bgFloat 9s infinite ease-in-out;
}

.circle1{
    width:260px;
    height:260px;
    background:#ffd0df;
    left:-120px;
    top:15%;
}

.circle2{
    width:230px;
    height:230px;
    background:#ffe4ae;
    right:-110px;
    top:55%;
    animation-delay:2s;
}

.circle3{
    width:180px;
    height:180px;
    background:#e2d1ff;
    left:45%;
    bottom:-80px;
    animation-delay:4s;
}

@keyframes bgFloat{
    50%{transform:translate(25px,-30px)}
}

/* HEADER */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:5000;
    background:rgba(255,249,245,.75);
    backdrop-filter:blur(18px);
    border-bottom:1px solid transparent;
    transition:.3s;
}

header.scrolled{
    background:rgba(255,255,255,.95);
    border-bottom-color:#f0deda;
    box-shadow:0 10px 35px rgba(50,20,20,.08);
}

.navbar{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:25px;
    font-weight:950;
}

.logo-icon{
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    border-radius:15px;
    color:white;
    background:linear-gradient(135deg,#e85d88,#ffabc4);
    box-shadow:0 10px 25px rgba(232,93,136,.3);
    transform:rotate(-5deg);
}

.logo span{
    color:var(--pink);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:27px;
    font-weight:750;
}

.nav-links a{
    position:relative;
    padding:8px 0;
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:2px;
    background:var(--pink);
    transition:.3s;
}

.nav-links a:hover::after{
    width:100%;
}

.nav-order{
    background:var(--brown);
    color:white;
    padding:12px 20px;
    border-radius:999px;
    transition:.3s;
}

.nav-order:hover{
    transform:translateY(-3px);
}

.menu-button{
    display:none;
    background:none;
    border:none;
    font-size:30px;
    color:var(--brown);
}

/* HERO */

.hero{
    min-height:100vh;
    padding-top:140px;
    padding-bottom:80px;
    display:flex;
    align-items:center;
}

.hero-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.badge{
    display:inline-flex;
    padding:9px 15px;
    border-radius:999px;
    background:#ffeaf1;
    color:#b43f64;
    font-size:13px;
    font-weight:900;
    margin-bottom:20px;
    animation:pulseBadge 2.5s infinite;
}

@keyframes pulseBadge{
    50%{box-shadow:0 0 0 8px rgba(232,93,136,.06)}
}

.hero h1{
    font-size:clamp(50px,7vw,95px);
    line-height:.94;
    letter-spacing:-5px;
    margin-bottom:25px;
}

.pink{
    color:var(--pink);
}

.outline{
    color:transparent;
    -webkit-text-stroke:1.5px var(--brown);
}

.hero-description{
    max-width:600px;
    color:var(--brown-light);
    font-size:18px;
    line-height:1.6;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:13px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:15px 22px;
    border-radius:16px;
    font-weight:900;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-5px);
}

.btn-primary{
    background:linear-gradient(135deg,var(--pink),var(--pink2));
    color:white;
    box-shadow:0 15px 30px rgba(232,93,136,.28);
}

.btn-secondary{
    background:white;
    border:1px solid #eadbd7;
}

.btn-whatsapp{
    background:var(--green);
    color:white;
    box-shadow:0 12px 25px rgba(32,184,102,.25);
}

.btn-call{
    background:var(--brown);
    color:white;
}

.hero-features{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    margin-top:30px;
    color:var(--brown-light);
    font-size:14px;
}

/* HERO CAKE */

.hero-art{
    min-height:520px;
    position:relative;
    display:grid;
    place-items:center;
}

.cake-scene{
    position:relative;
    width:390px;
    height:400px;
    animation:cakeFloat 5s infinite ease-in-out;
}

@keyframes cakeFloat{
    50%{transform:translateY(-15px)}
}

.plate{
    position:absolute;
    width:390px;
    height:70px;
    bottom:45px;
    border-radius:50%;
    background:linear-gradient(#fff,#eee2de);
    box-shadow:0 25px 35px rgba(60,25,25,.16);
}

.main-cake{
    position:absolute;
    width:300px;
    height:260px;
    left:45px;
    bottom:100px;
    filter:drop-shadow(0 25px 18px rgba(70,25,35,.18));
}

.cake-layer{
    position:absolute;
    left:0;
    width:100%;
    border-radius:18px 18px 25px 25px;
}

.layer-bottom{
    height:115px;
    bottom:0;
    background:linear-gradient(90deg,#ed8ca8,#fff0f4,#e9809e);
}

.layer-middle{
    height:95px;
    width:90%;
    left:5%;
    bottom:90px;
    background:linear-gradient(90deg,#fff4ed,#ffe3dc,#f7b6ae);
}

.layer-top{
    height:80px;
    width:76%;
    left:12%;
    bottom:165px;
    background:linear-gradient(90deg,#f4b6c9,#fff5f7,#ed9db5);
}

.icing{
    position:absolute;
    left:12%;
    bottom:205px;
    width:76%;
    height:42px;
    background:#fff;
    border-radius:50%;
}

.drip{
    position:absolute;
    background:white;
    width:17px;
    border-radius:0 0 12px 12px;
}

.drip1{
    height:35px;
    left:25%;
    bottom:186px;
}

.drip2{
    height:50px;
    left:43%;
    bottom:185px;
}

.drip3{
    height:30px;
    left:64%;
    bottom:190px;
}

.cherry{
    position:absolute;
    width:27px;
    height:27px;
    border-radius:50%;
    background:#d94061;
    left:48%;
    bottom:238px;
}

.cherry::before{
    content:"";
    position:absolute;
    width:28px;
    height:20px;
    border-left:3px solid #4d914e;
    border-radius:50%;
    left:12px;
    top:-15px;
    transform:rotate(35deg);
}

.sparkle{
    position:absolute;
    font-size:32px;
    animation:sparkle 2s infinite;
}

.sparkle1{
    left:15px;
    top:50px;
}

.sparkle2{
    right:15px;
    top:130px;
    animation-delay:.6s;
}

.sparkle3{
    left:30px;
    bottom:80px;
    animation-delay:1s;
}

@keyframes sparkle{
    50%{
        transform:scale(1.35) rotate(20deg);
        opacity:.5;
    }
}

.floating-card{
    position:absolute;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);
    padding:14px 17px;
    border-radius:18px;
    font-weight:850;
    box-shadow:var(--shadow);
    animation:cardFloat 4s infinite ease-in-out;
}

.card1{
    top:90px;
    right:0;
}

.card2{
    bottom:90px;
    left:0;
}

@keyframes cardFloat{
    50%{transform:translateY(-10px)}
}

/* SECTIONS */

section{
    padding:100px 0;
}

.section-title{
    max-width:700px;
    margin:0 auto 45px;
    text-align:center;
}

.eyebrow{
    text-transform:uppercase;
    color:var(--pink);
    font-weight:950;
    letter-spacing:3px;
    font-size:12px;
}

.section-title h2{
    font-size:clamp(38px,5vw,65px);
    line-height:1;
    letter-spacing:-3px;
    margin:10px 0 15px;
}

.section-title p{
    color:var(--brown-light);
    line-height:1.6;
}

/* FEATURES */

.feature-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.feature-card{
    background:white;
    padding:22px;
    border:1px solid var(--border);
    border-radius:20px;
    display:flex;
    gap:14px;
    align-items:center;
    box-shadow:0 12px 30px rgba(70,30,30,.05);
    transition:.3s;
}

.feature-card:hover{
    transform:translateY(-7px);
}

.feature-icon{
    font-size:30px;
}

.feature-card small{
    display:block;
    color:var(--brown-light);
    margin-top:3px;
}

/* CAKES */

.cake-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.product{
    background:white;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 12px 35px rgba(70,30,30,.06);
    transition:.35s;
}

.product:hover{
    transform:translateY(-10px);
    box-shadow:var(--shadow);
}

.product-image{
    height:245px;
    display:grid;
    place-items:center;
    position:relative;
}

.product-bg1{
    background:linear-gradient(135deg,#fff0f5,#ffdce8);
}

.product-bg2{
    background:linear-gradient(135deg,#f8e6dc,#d8b09d);
}

.product-bg3{
    background:linear-gradient(135deg,#fff5c8,#f7d982);
}

.product-bg4{
    background:linear-gradient(135deg,#f1e8ff,#d7c3f5);
}

.product-bg5{
    background:linear-gradient(135deg,#e8f7ff,#bde7f6);
}

.product-bg6{
    background:linear-gradient(135deg,#ffe9dc,#ffc2a8);
}

.product-tag{
    position:absolute;
    top:14px;
    left:14px;
    background:white;
    padding:7px 11px;
    border-radius:999px;
    font-size:11px;
    font-weight:950;
}

.mini-cake{
    width:165px;
    height:135px;
    position:relative;
    filter:drop-shadow(0 15px 10px rgba(60,30,30,.16));
    transition:.4s;
}

.product:hover .mini-cake{
    transform:scale(1.08) rotate(-2deg);
}

.mini-bottom{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    border-radius:15px 15px 20px 20px;
    background:linear-gradient(90deg,#ef8faa,#fff0f2,#ea829e);
}

.mini-top{
    position:absolute;
    bottom:50px;
    left:10%;
    width:80%;
    height:55px;
    border-radius:15px 15px 20px 20px;
    background:linear-gradient(90deg,#fff,#ffe8ee,#f9b6c6);
}

.mini-cream{
    position:absolute;
    left:10%;
    bottom:96px;
    width:80%;
    height:24px;
    background:white;
    border-radius:50%;
}

.product-info{
    padding:22px;
}

.product-info h3{
    font-size:21px;
}

.product-info p{
    color:var(--brown-light);
    font-size:14px;
    line-height:1.5;
    margin:7px 0 15px;
}

.price-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.price{
    color:var(--pink);
    font-weight:950;
}

/* FLAVORS */

.flavor-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.flavor{
    background:rgba(255,255,255,.8);
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    transition:.3s;
}

.flavor:hover{
    transform:translateY(-7px);
    background:white;
    box-shadow:var(--shadow);
}

.flavor-icon{
    font-size:35px;
}

.flavor h3{
    margin:8px 0 3px;
}

.flavor p{
    color:var(--brown-light);
    font-size:14px;
    line-height:1.5;
}

/* ABOUT */

.about{
    background:#2c1818;
    color:white;
    position:relative;
    overflow:hidden;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.about h2{
    font-size:clamp(40px,5vw,68px);
    line-height:1;
    letter-spacing:-3px;
    margin:10px 0 20px;
}

.about p{
    color:#d7c4c0;
    max-width:580px;
    line-height:1.7;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:30px;
}

.stat{
    padding:18px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
}

.stat strong{
    display:block;
    font-size:28px;
}

.stat span{
    color:#cdb9b5;
    font-size:12px;
}

.about-art{
    height:430px;
    border-radius:35px;
    background:linear-gradient(135deg,#f7a6bc,#ffe6df);
    display:grid;
    place-items:center;
    transform:rotate(2deg);
}

.about-art span{
    font-size:150px;
    animation:bigCake 3s infinite;
}

@keyframes bigCake{
    50%{
        transform:translateY(-12px) rotate(-5deg);
    }
}

/* CAKEHUB AI */
.cake-ai-section{
    background:linear-gradient(135deg,#fff8fb,#f8f2ff);
}
.cake-ai-card{
    max-width:900px;
    margin:auto;
    background:#1f141a;
    color:white;
    border:1px solid rgba(255,255,255,.1);
    border-radius:30px;
    padding:28px;
    box-shadow:0 25px 70px rgba(70,30,50,.18);
}
.cake-ai-header{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}
.cake-ai-icon{
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    border-radius:18px;
    font-size:28px;
    background:linear-gradient(135deg,var(--pink),#9a63ff);
}
.cake-ai-header h3{font-size:22px}
.cake-ai-header p{color:#d8c8ce;font-size:13px;margin-top:4px}
.ai-quick-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:18px;
}
.ai-quick-buttons button{
    border:1px solid rgba(255,255,255,.12);
    background:#2b1d24;
    color:#fff;
    padding:10px 13px;
    border-radius:12px;
    cursor:pointer;
}
.ai-quick-buttons button:hover{background:#392630}
.ai-chat{
    min-height:170px;
    max-height:300px;
    overflow:auto;
    display:grid;
    gap:10px;
    padding:5px;
    margin-bottom:14px;
}
.ai-message{
    display:flex;
    flex-direction:column;
    gap:5px;
    max-width:82%;
    padding:12px 14px;
    border-radius:14px;
    line-height:1.5;
    font-size:14px;
}
.ai-message.bot{background:#2a1d24}
.ai-message.user{background:linear-gradient(135deg,var(--pink),#925cff);margin-left:auto}
.ai-message span{color:#e9dfe3}
.ai-message.user span{color:white}
.ai-composer{
    display:flex;
    gap:9px;
    background:#171016;
    border:1px solid rgba(255,255,255,.12);
    padding:8px;
    border-radius:15px;
}
.ai-composer input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:10px;
}
.ai-composer input::placeholder{color:#93848b}
.ai-composer button{
    border:0;
    background:linear-gradient(135deg,var(--pink),#925cff);
    color:white;
    border-radius:11px;
    padding:11px 16px;
    font-weight:800;
}
#customPoundField input{width:100%}

/* URGENT */

.urgent{
    padding-top:50px;
    padding-bottom:70px;
}

.urgent-box{
    position:relative;
    overflow:hidden;
    border-radius:32px;
    padding:40px;
    background:linear-gradient(135deg,#351c1c,#5c252d);
    color:white;
    box-shadow:0 25px 60px rgba(70,25,30,.2);
}

.urgent-box h2{
    font-size:clamp(35px,5vw,58px);
    line-height:1;
    margin:10px 0 15px;
}

.urgent-box p{
    max-width:650px;
    color:#ead7d4;
    line-height:1.7;
}

.urgent-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;
}

/* ORDER */

.order-section{
    padding-top:50px;
}

.order-grid{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:30px;
}

.order-intro{
    background:linear-gradient(145deg,#3a2020,#241313);
    color:white;
    border-radius:30px;
    padding:35px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
}

.order-intro h2{
    font-size:48px;
    line-height:1;
    margin:12px 0 18px;
}

.order-intro p{
    color:#d9c6c3;
    line-height:1.6;
}

.order-points{
    margin-top:28px;
    display:grid;
    gap:12px;
}

.form-card{
    background:white;
    border:1px solid var(--border);
    border-radius:30px;
    padding:32px;
    box-shadow:var(--shadow);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-field{
    display:grid;
    gap:7px;
}

.form-field.full,
.submit-area{
    grid-column:1/-1;
}

input,select,textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid #eadbd7;
    border-radius:14px;
    outline:none;
    background:#fffaf8;
    color:var(--brown);
}

textarea{
    resize:vertical;
    min-height:115px;
}

.img-preview{
    margin-top:10px;
    max-width:100%;
    max-height:180px;
    border-radius:12px;
    border:1px solid var(--border);
    display:none;
    object-fit:cover;
}

.submit-area .btn{
    width:100%;
    min-height:55px;
}

.success-message{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:13px;
    background:#e8f8ed;
    color:#28623a;
    font-weight:750;
    line-height:1.5;
}

.success-message.show{
    display:block;
}

/* DATABASE PANEL */

.database-section{
    background:#fff;
}

.database-card{
    background:white;
    border:1px solid var(--border);
    border-radius:28px;
    padding:30px;
    box-shadow:var(--shadow);
}

.database-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.database-status{
    padding:8px 13px;
    border-radius:999px;
    background:#e8f8ed;
    color:#28623a;
    font-size:12px;
    font-weight:900;
}

.order-record{
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-top:12px;
    background:#fffaf8;
}

.order-record strong{
    color:var(--pink);
}

.order-record small{
    display:block;
    color:var(--brown-light);
    margin-top:5px;
}

.record-image-wrapper{
    margin-top:10px;
}

.record-image{
    max-width:200px;
    max-height:160px;
    border-radius:12px;
    border:1px solid var(--border);
    object-fit:cover;
    display:block;
}

.database-empty{
    color:var(--brown-light);
    padding:20px;
    text-align:center;
}

/* CONTACT */

.contact-grid{
    display:grid;
    grid-template-columns:1fr;
    max-width:400px;
    margin:auto;
}

.contact-box{
    background:white;
    border:1px solid var(--border);
    border-radius:22px;
    padding:25px;
    transition:.3s;
}

.contact-box:hover{
    transform:translateY(-7px);
    box-shadow:var(--shadow);
}

.contact-icon{
    font-size:32px;
}

.contact-box h3{
    margin:8px 0;
}

.contact-box p{
    color:var(--brown-light);
    line-height:1.6;
}

/* FOOTER */

footer{
    background:#241313;
    color:white;
    padding:45px 0 25px;
}

.footer-top{
    display:flex;
    justify-content:space-between;
    gap:30px;
}

.footer-description{
    max-width:430px;
    color:#c9b6b2;
    margin-top:12px;
    line-height:1.6;
}

.socials{
    display:flex;
    gap:10px;
}

.social{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:#382323;
    transition:.3s;
    font-weight:900;
}

.social:hover{
    transform:translateY(-5px);
}

.copyright{
    margin-top:35px;
    padding-top:20px;
    border-top:1px solid #432b2b;
    text-align:center;
    color:#a9918c;
    font-size:13px;
}

/* TOAST */

#toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#241313;
    color:white;
    padding:15px 18px;
    border-radius:16px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    transform:translateY(120px);
    opacity:0;
    transition:.4s;
    z-index:10000;
    max-width:calc(100% - 30px);
}

#toast.show{
    transform:translateY(0);
    opacity:1;
}
